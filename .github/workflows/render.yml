name: Render explainer

on:
  workflow_dispatch:

jobs:
  render:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render preview
        run: npx remotion render src/index.tsx Explainer out/diagnostic-20s.mp4 --frames=0-599 --concurrency=4 --chrome-mode=headless-shell --x264-preset=faster --log=verbose

      - name: Upload preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: explainer-diagnostic-20s
          path: out/diagnostic-20s.mp4
